name: bellotadevelopment
description: "OFICIAL Bellota App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  google_fonts: ^8.2.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  sqflite_common_ffi: ^2.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  pdf:  ^3.11.1
  printing: ^5.13.2
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  google_sign_in: 6.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Estrella
      fonts:
        - asset: assets/fonts/Estrella.ttf
